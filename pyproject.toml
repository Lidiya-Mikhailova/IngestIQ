[project]
name = "ingestiq"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "streamlit",
    "apache-airflow>=2.8.0",
    "dbt-core>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
ingestiq = "src.cli.main:main"
